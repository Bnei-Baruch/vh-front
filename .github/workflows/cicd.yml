name: CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - staging-new
          - production
          - production-new

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables
        run: |
          # PUBLIC_URL is baked into the bundle at build time, so each deploy
          # target needs its own value. The old if/else gave anything that was
          # not "production" the eurokab.info URL, which would have produced a
          # build-out image that loads its assets from the wrong host.
          case "${{ inputs.environment }}" in
            production)     echo "PUBLIC_URL=https://kli.one"               >> $GITHUB_ENV ;;
            production-new) echo "PUBLIC_URL=https://production-vh.kli.one" >> $GITHUB_ENV ;;
            staging)        echo "PUBLIC_URL=https://eurokab.info"          >> $GITHUB_ENV ;;
            staging-new)    echo "PUBLIC_URL=https://staging-vh.kli.one"    >> $GITHUB_ENV ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bnei-baruch/vh-front:latest
            ghcr.io/bnei-baruch/vh-front:${{ env.SHORT_SHA }}
          build-args: |
            REACT_APP_COMMIT_SHA=${{ env.SHORT_SHA }}
            PUBLIC_URL=${{ env.PUBLIC_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5

      - name: Set environment variables
        run: |
          # Explicit per-environment selection with no fall-through.
          case "${{ inputs.environment }}" in
            production)     echo "SSH_HOST=${{ secrets.VH_HOST_PRODUCTION }}"     >> $GITHUB_ENV ;;
            production-new) echo "SSH_HOST=${{ secrets.VH_HOST_PRODUCTION_NEW }}" >> $GITHUB_ENV ;;
            staging)        echo "SSH_HOST=${{ secrets.VH_HOST_STAGING }}"        >> $GITHUB_ENV ;;
            staging-new)    echo "SSH_HOST=${{ secrets.VH_HOST_STAGING_NEW }}"    >> $GITHUB_ENV ;;
            *) echo "Unknown environment: ${{ inputs.environment }}" >&2; exit 1 ;;
          esac
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          # The on-prem VMs are only reachable through the bastion.
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USERNAME }}
          proxy_key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,config-templates/"
          target: /root/vh-docker/apps/vh-front/

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.SSH_HOST }}
          username: root
          key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          # The on-prem VMs are only reachable through the bastion.
          proxy_host: ${{ secrets.SSH_PROXY_HOST }}
          proxy_username: ${{ secrets.SSH_PROXY_USERNAME }}
          proxy_key: ${{ secrets.BBDEPLOYMENT_SSH_PRIVATE_KEY }}
          envs: SHORT_SHA
          script: |
            cd /root/vh-docker/apps/vh-front
            set -a
            source .env
            set +a
            mkdir -p public/config
            gomplate --input-dir=config-templates \
              --output-map="/root/vh-docker/apps/vh-front/public/config/{{ .in | strings.ReplaceAll \".js\" \"-$SHORT_SHA.js\" }}"
            export IMAGE_NAME=ghcr.io/bnei-baruch/vh-front:$SHORT_SHA
            docker compose pull
            docker compose up -d
